name: Latest YouTube Videos
on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-youtube:
    name: Update this repo's README with latest videos from YouTube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          comment_tag_name: "YOUTUBE"
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UCKV_YQHNBqjjriKHUfe-2jg"
          # YouTube's feed occasionally returns 5xx; retry instead of failing the run.
          retry_count: 3
          retry_wait_time: 10
          enable_keepalive: false
