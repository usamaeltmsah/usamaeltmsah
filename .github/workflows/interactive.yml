name: Visitor chess and guestbook

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# One visitor at a time, so two moves never race on the same board.
concurrency:
  group: interactive
  cancel-in-progress: false

jobs:
  handle:
    if: startsWith(github.event.issue.title, 'chess|') || startsWith(github.event.issue.title, 'guestbook|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Apply the visitor's request
        # Issue text is untrusted: it reaches the script only through env vars.
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_DATE: ${{ github.event.issue.created_at }}
          REPLY_PATH: ${{ runner.temp }}/reply.md
        run: python .github/scripts/interactive.py
      - name: Commit changes
        env:
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md interactive
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: visitor update from @${ISSUE_USER}"
          for attempt in 1 2 3; do
            git pull --rebase origin master && git push origin HEAD:master && exit 0
            sleep 5
          done
          exit 1
      - name: Reply and close the issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMBER: ${{ github.event.issue.number }}
          REPLY_PATH: ${{ runner.temp }}/reply.md
        run: |
          if [ -s "$REPLY_PATH" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$REPLY_PATH"
          else
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "⚠️ Something went wrong on my side. Please try again in a minute."
          fi
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
